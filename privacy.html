<html>
<head>
<meta charset="utf-8">
<title>Untitled Document</title>
<link rel="stylesheet" href="assets/friendspace.css">
<script src="assets/trophies.js"></script>
<script src="assets/notes.js"></script>
<script src="assets/scrollbars.js"></script>
<script src="assets/buttons.js"></script>
<script src="assets/ambient.js"></script>
<style>
body{min-width:0;background:#008080}

.doc{
  max-width:820px;margin:12px auto;background:#c0c0c0;border:2px outset #fff;
  box-shadow:3px 3px 0 rgba(0,0,0,.35);
  font-family:"MS Sans Serif",Tahoma,Geneva,sans-serif;font-size:12px;
}
.title{
  background:linear-gradient(90deg,#000080,#1084d0);color:#fff;padding:3px 5px;
  font-weight:bold;display:flex;align-items:center;
}
.title .btns{margin-left:auto;display:flex;gap:2px}
.title .btns b{background:#c0c0c0;border:1px outset #fff;color:#000;width:16px;height:14px;
  font:bold 10px/12px "MS Sans Serif";text-align:center}
.body{padding:9px 11px}

.meta{display:flex;gap:9px;font-size:11px;color:#000;margin-bottom:7px;align-items:center}
.meta span{border:1px inset #c0c0c0;padding:1px 6px;background:#c0c0c0}
.meta .prog{flex:1;text-align:center;font-family:"Courier New",monospace}

/* the reading pane: six lines at a time, and the wheel runs backwards */
#pane{
  height:118px;overflow-y:scroll;background:#fff;border:2px inset #c0c0c0;
  padding:7px 9px;font-family:"Times New Roman",Times,serif;font-size:13px;line-height:1.42;
  overscroll-behavior:contain;
}
#pane h4{margin:11px 0 3px;font-size:13px}
#pane p{margin:0 0 8px}
#pane .odd{color:#000}

.hintline{font-size:11px;color:#000080;margin-top:6px;min-height:16px}
.agree{margin-top:9px;display:flex;align-items:center;gap:7px;font-size:12px}
.agree input[disabled]+span{color:#808080}
.btn95{background:#c0c0c0;border:2px outset #fff;padding:3px 12px;
  font:12px "MS Sans Serif",Tahoma,sans-serif;cursor:pointer}
.btn95:active{border-style:inset}
.btn95[disabled]{color:#808080;cursor:not-allowed}
.statusbar{background:#c0c0c0;border-top:1px solid #fff;padding:3px 6px;font-size:11px;display:flex;gap:9px}
.statusbar span{border:1px inset #c0c0c0;padding:1px 6px}
.statusbar .grow{flex:1}
</style>
</head>
<body>

<div class="fs-header"><div class="fs-header-in">
  <div class="fs-logo">Friendspace<span>BETA</span></div>
  <div class="fs-nav">
    <a href="feed.html">Feed</a><a href="profile.html">Profiles</a>
    <a href="settings.html">Settings</a><a href="awards.html">Awards</a>
  </div>
</div></div>

<div class="doc">
  <div class="title">Privacy Policy and Terms of Service
    <span class="btns"><b>_</b><b>□</b><b>×</b></span>
  </div>
  <div class="body">
    <div class="meta">
      <span id="words">0 words</span>
      <span class="prog" id="prog">[..........] 0%</span>
      <span id="timer">resets in 14s</span>
    </div>

    <div id="pane"></div>
    <div class="hintline" id="hint"></div>

    <div class="agree">
      <input type="checkbox" id="agree" disabled>
      <span id="agreeLabel">I have read and understood the Privacy Policy in its entirety.</span>
    </div>
    <div style="margin-top:9px">
      <button class="btn95" id="accept" disabled>Accept</button>
      <button class="btn95" id="decline">Decline</button>
    </div>
  </div>
  <div class="statusbar">
    <span id="sb">Ready</span>
    <span class="grow">friendspace.example/legal/privacy.htm</span>
    <span>800x600</span>
  </div>
</div>

<script>
"use strict";
var T = FS.Trophies, $ = function(s){ return document.querySelector(s); };

/* ============================================================
   THE POLICY — real-looking boilerplate with a handful of
   clauses that are not. Generated so the word count is honest.
   ============================================================ */
var BOILER = [
  "The Company may collect, retain, process and transmit information relating to your use of the Service, including but not limited to information you have not provided.",
  "You acknowledge that the Service is provided on an as-is basis and that no representation is made as to its fitness, availability, correctness or continued existence.",
  "Information collected under this Policy may be shared with affiliates, partners, sub-processors, and any party that asks.",
  "The Company reserves the right to amend this Policy at any time without notice, including retroactively, including in respect of periods preceding your birth.",
  "Where local law confers upon you a right that conflicts with this Policy, this Policy shall be read as though that law does not exist.",
  "You agree that any dispute shall be resolved by binding arbitration, conducted by an arbitrator selected by the Company, in a venue selected by the Company, at a time selected by the Company.",
  "Nothing in this section shall be construed to limit anything in any other section, including this one.",
  "The Company processes your information on the basis of legitimate interest. The interest is the Company's.",
  "You may request a copy of the data held about you. The Company may decline that request, and will.",
  "Cookies, pixels, beacons, fingerprints and other technologies may be used to recognise you across services, devices, households and generations.",
  "Data is retained for as long as necessary. Necessity is determined by the Company and is not subject to review.",
  "In the event of a merger, acquisition, restructuring or insolvency, your information shall be treated as an asset.",
  "You are responsible for maintaining the confidentiality of your credentials, which are displayed on your public profile.",
  "The Company does not sell your personal information. The Company licenses it, which is different.",
  "By continuing to scroll, you signify agreement to the terms above, below, and not yet written."
];

/* the clauses that are not boilerplate */
var ODD = [
  { at: 150, t:"<b>Clause 4.2 (Soul).</b> By accepting these terms you grant the Company a " +
              "non-exclusive, perpetual, irrevocable, worldwide licence to your immortal soul. " +
              "This clause is included to determine whether anyone reads this document. " +
              "Nobody ever has." },
  { at: 334, t:"<b>Clause 7.1 (Naming).</b> Should you at any time have a child, the Company " +
              "shall be entitled to be consulted on the name, and to veto up to two proposals." },
  { at: 560, t:"<b>Clause 9.4 (Weather).</b> The Company accepts no liability for the weather " +
              "in your area, notwithstanding any influence the Company may exert over it." },
  { at: 786, t:"<b>Clause 12.8 (Correspondence).</b> Any notice served upon the Company must be " +
              "delivered by hand, in person, to an address the Company will not disclose." },
  { at: 1034, t:"<b>Clause 15.3 (Ghost).</b> The account deletion facility described in the " +
              "Settings area is provided for illustrative purposes and does not delete accounts." },
  { at: 1399,t:"<b>Clause 18.0 (Congratulations).</b> If you are reading this, you have reached the " +
              "end of the Privacy Policy. You are the first. Your award has been issued." }
];

var SECTIONS = ["Collection","Use","Disclosure","Retention","Your Rights","Security",
                "International Transfers","Children","Changes","Contact","Miscellaneous","Further Miscellaneous"];

var PARAS = 1400, html = "", words = 0, oddAt = {};
ODD.forEach(function(o){ oddAt[o.at] = o.t; });

for (var i = 0; i < PARAS; i++){
  if (i % 11 === 0){
    html += "<h4>" + (Math.floor(i/11)+1) + ". " + SECTIONS[Math.floor(i/11) % SECTIONS.length] + "</h4>";
  }
  var txt = oddAt[i] ? oddAt[i] : BOILER[i % BOILER.length];
  html += "<p class='" + (oddAt[i] ? "odd" : "") + "'>" + txt + "</p>";
  words += txt.replace(/<[^>]+>/g, "").split(/\s+/).length;
}

var pane = $("#pane");
pane.innerHTML = html;
$("#words").textContent = words.toLocaleString("en-US") + " words";

/* ============================================================
   CRIME: the wheel is inverted, so scrolling down moves you up.
   And the pane resets to the top every 14 seconds.
   The escape hatch is a consequence of the crime rather than an
   exception to it: since everything is inverted, Home jumps to
   the bottom. Discoverable, and it wins outright.
   ============================================================ */
pane.addEventListener("wheel", function(e){
  e.preventDefault();
  pane.scrollTop -= e.deltaY;         /* backwards, deliberately */
}, { passive:false });

pane.setAttribute("tabindex", "0");
pane.addEventListener("keydown", function(e){
  var k = e.key;
  if (k === "Home"){ e.preventDefault(); pane.scrollTop = pane.scrollHeight; }
  else if (k === "End"){ e.preventDefault(); pane.scrollTop = 0; }
  else if (k === "PageDown"){ e.preventDefault(); pane.scrollTop -= 100; }
  else if (k === "PageUp"){ e.preventDefault(); pane.scrollTop += 100; }
  else if (k === "ArrowDown"){ e.preventDefault(); pane.scrollTop -= 24; }
  else if (k === "ArrowUp"){ e.preventDefault(); pane.scrollTop += 24; }
});

var reached = false;
function pct(){
  var max = pane.scrollHeight - pane.clientHeight;
  return max <= 0 ? 100 : Math.round(pane.scrollTop / max * 100);
}
pane.addEventListener("scroll", function(){
  var p = pct();
  var bars = Math.round(p/10);
  $("#prog").textContent = "[" + "#".repeat(bars) + ".".repeat(10-bars) + "] " + p + "%";
  if (p >= 99 && !reached){
    reached = true;
    clearInterval(resetTimer);
    $("#agree").disabled = false;
    $("#hint").innerHTML = "<b>You have reached the end of the Privacy Policy.</b>";
    $("#timer").textContent = "no longer resetting";
    T.unlock("readit");
  }
});

/* the reset, and the hint that eventually gives the trick away */
var left = 14, resets = 0, resetTimer = setInterval(function(){
  left--;
  $("#timer").textContent = "resets in " + left + "s";
  if (left <= 0){
    left = 14; resets++;
    pane.scrollTop = 0;
    $("#sb").textContent = "Session expired — returned to top (" + resets + ")";
    if (resets === 1) $("#hint").textContent = "Tip: the scroll wheel is inverted on this page.";
    if (resets >= 2) $("#hint").innerHTML =
      "Tip: the scroll wheel is inverted on this page. <b>So are Home and End.</b>";
  }
}, 1000);

$("#agree").addEventListener("change", function(){
  $("#accept").disabled = !this.checked;
});
$("#accept").addEventListener("click", function(){
  $("#hint").innerHTML = "<b>Thank you.</b> Your acceptance has been recorded against a " +
    "different version of this document.";
});
$("#decline").addEventListener("click", function(){
  $("#hint").textContent = "Declining is not available in your region.";
});
</script>
</body>
</html>
