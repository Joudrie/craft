<html>
<head>
<meta charset="utf-8">
<title>Untitled Document</title>
<link rel="stylesheet" href="assets/friendspace.css">
<script src="assets/trophies.js"></script>
<script src="assets/notes.js"></script>

<style>
/* ============================================================
   THE 2002 STRATUM
   Settings was never migrated. It still uses the frame layout,
   the system palette, and the original wording.
   ============================================================ */
body{min-width:0;background:#008080}          /* the teal. of course the teal. */

.win{
  max-width:940px;margin:12px auto;background:#c0c0c0;
  border:2px outset #fff;box-shadow:3px 3px 0 rgba(0,0,0,.35);
  font-family:"MS Sans Serif",Tahoma,Geneva,sans-serif;font-size:12px;color:#000;
}
.title{
  background:linear-gradient(90deg,#000080,#1084d0);color:#fff;
  padding:3px 5px;font-weight:bold;font-size:12px;display:flex;align-items:center;
}
.title .btns{margin-left:auto;display:flex;gap:2px}
.title .btns b{
  background:#c0c0c0;border:1px outset #fff;color:#000;width:16px;height:14px;
  font:bold 10px/12px "MS Sans Serif";text-align:center;cursor:pointer;
}
.menubar{background:#c0c0c0;border-bottom:1px solid #808080;padding:2px 5px;font-size:12px}
.menubar span{padding:1px 7px;cursor:default}
.menubar span:hover{background:#000080;color:#fff}

/* the frameset that was never replaced */
.frames{display:flex;min-height:430px;border-top:1px solid #808080}
.fr-nav{
  width:172px;flex:none;background:#fff;border:2px inset #c0c0c0;margin:3px;
  overflow-y:auto;max-height:430px;
}
.fr-main{
  flex:1;background:#fff;border:2px inset #c0c0c0;margin:3px 3px 3px 0;
  padding:9px 11px;overflow-y:auto;max-height:430px;
}
.fr-nav a{display:block;padding:4px 8px;color:#0000ee;font-size:12px;text-decoration:underline;cursor:pointer}
.fr-nav a:hover{background:#000080;color:#fff}
.fr-nav a.cur{background:#000080;color:#fff}
.fr-nav .grp{background:#c0c0c0;padding:3px 8px;font-weight:bold;font-size:11px;border-bottom:1px solid #808080}

h3.sec{font-size:14px;margin:0 0 3px;font-family:"Times New Roman",serif}
p.lead{color:#404040;margin:0 0 12px;font-size:11px}

/* ---- the double-negative privacy toggles ---- */
table.tg{width:100%;border-collapse:collapse;font-size:11px}
table.tg td{border-bottom:1px dotted #a0a0a0;padding:5px 4px;vertical-align:top}
table.tg td.c{width:22px}
table.tg td.st{width:96px;text-align:right;font-weight:bold;font-family:"Courier New",monospace}
.on-v{color:#a00}
.off-v{color:#060}
.btn95{
  background:#c0c0c0;border:2px outset #fff;padding:3px 12px;
  font:12px "MS Sans Serif",Tahoma,sans-serif;cursor:pointer;
}
.btn95:active{border-style:inset}
.btn95[disabled]{color:#808080;cursor:not-allowed}
.saved{font-size:11px;color:#000080;margin-top:9px;min-height:30px}

/* ---- the deletion corridor ---- */
.lvl{border:2px inset #c0c0c0;background:#fff;padding:11px;margin-top:8px}
.lvl h4{margin:0 0 6px;font-size:13px;font-family:"Times New Roman",serif}
.lvl p{margin:0 0 9px;font-size:11px;line-height:1.5}
.lvl input[type=text]{
  width:100%;padding:4px;border:2px inset #c0c0c0;font:12px "Courier New",monospace;
}
.corridor{font-size:10px;color:#606060;margin-top:7px;font-family:"Courier New",monospace}
.holdbar{
  width:100%;height:17px;border:2px inset #c0c0c0;background:#fff;position:relative;
  overflow:hidden;margin-top:6px;
}
.holdbar i{position:absolute;inset:0;width:0;background:#000080}
.radio{display:block;margin:3px 0;font-size:11px}
.warn{background:#ffffcc;border:1px solid #808000;padding:6px 8px;font-size:11px;margin:8px 0}

.statusbar{
  background:#c0c0c0;border-top:1px solid #fff;padding:3px 6px;font-size:11px;
  display:flex;gap:10px;
}
.statusbar span{border:1px inset #c0c0c0;padding:1px 6px;flex:none}
.statusbar span.grow{flex:1}
</style>
</head>
<body>

<div class="fs-header"><div class="fs-header-in">
  <div class="fs-logo">Friendspace<span>BETA</span></div>
  <div class="fs-nav">
    <a href="feed.html">Feed</a><a href="profile.html">Profiles</a>
    <a href="privacy.html">Privacy Policy</a><a href="awards.html">Awards</a>
  </div>
</div></div>

<div class="win">
  <div class="title">Friendspace Account Settings
    <span class="btns"><b>_</b><b>□</b><b>×</b></span>
  </div>
  <div class="menubar"><span>File</span><span>Edit</span><span>View</span><span>Help</span></div>

  <div class="frames">
    <!-- the navigation frame, which has never updated -->
    <div class="fr-nav" id="nav">
      <div class="grp">Settings</div>
    </div>
    <div class="fr-main" id="main"></div>
  </div>

  <div class="statusbar">
    <span id="sbLeft">Ready</span>
    <span class="grow" id="sbMid">Friendspace Settings v1.0 (2002)</span>
    <span>800x600</span>
  </div>
</div>

<script>
"use strict";
var T = FS.Trophies, $ = function(s){ return document.querySelector(s); };
T.unlock("archaeologist");

/* ============================================================
   PRIVACY TOGGLES — every label is negated an arbitrary number
   of times, so the checkbox state tells you nothing on its own.
   The right-hand column reports what the setting ACTUALLY does,
   which is what makes this a puzzle instead of a trick: you can
   always verify. Get all ten to PRIVATE to solve it.
   ============================================================ */
var SETTINGS = [
  { l:"Do not disallow non-restricted profile sharing",                     n:3, v:true  },
  { l:"Prevent the suppression of unrestricted visibility",                 n:2, v:true  },
  { l:"Disable the opt-out from non-anonymous indexing",                    n:3, v:true  },
  { l:"Withhold consent to decline third-party non-disclosure",             n:3, v:true  },
  { l:"Never refrain from omitting your data from partner exports",         n:3, v:true  },
  { l:"Unblock the restriction on public availability",                     n:2, v:true  },
  { l:"Do not prevent the disabling of the privacy limitation",             n:3, v:true  },
  { l:"Decline to withhold your activity from unaffiliated processors",     n:2, v:true  },
  { l:"Stop the cessation of continuous location retention",                n:2, v:true  },
  { l:"Refuse to not share everything, always, with everyone",              n:2, v:true  }
];

/* effective meaning = checkbox XOR (odd number of negations) */
function effective(s){ return (s.n % 2 === 1) ? !s.v : s.v; }

function renderPrivacy(){
  var rows = SETTINGS.map(function(s, i){
    var eff = effective(s);
    return "<tr><td class='c'><input type='checkbox' data-i='" + i + "'" + (s.v ? " checked" : "") + "></td>" +
           "<td>" + s.l + "</td>" +
           "<td class='st " + (eff ? "on-v" : "off-v") + "'>" +
           (eff ? "SHARING" : "PRIVATE") + "</td></tr>";
  }).join("");

  $("#main").innerHTML =
    "<h3 class='sec'>Privacy</h3>" +
    "<p class='lead'>Control how your information is shared. Settings take effect immediately, " +
    "except where they do not.</p>" +
    "<table class='tg'><tr><td class='c'></td><td><b>Setting</b></td>" +
    "<td class='st'><b>ACTUAL EFFECT</b></td></tr>" + rows + "</table>" +
    "<div style='margin-top:11px'><button class='btn95' id='savePriv'>Save Changes</button> " +
    "<button class='btn95' id='allPriv'>Make Everything Private</button></div>" +
    "<div class='saved' id='saveNote'></div>";

  [].forEach.call($("#main").querySelectorAll("input[data-i]"), function(cb){
    cb.onchange = function(){
      SETTINGS[+this.dataset.i].v = this.checked;
      renderPrivacy();
      checkSolved();
    };
  });

  $("#savePriv").onclick = function(){
    /* saving works. the confirmation describes the opposite. */
    var priv = SETTINGS.filter(function(s){ return !effective(s); }).length;
    $("#saveNote").innerHTML = "Your changes have been saved.<br>" +
      "<span style='color:#a00'>" + (10 - priv) + " of 10 settings are now private.</span>" +
      "<br><span style='color:#606060;font-size:10px'>(The table above is correct. This summary is not.)</span>";
  };
  $("#allPriv").onclick = function(){
    /* the shortcut ticks every box, which is not the same thing */
    SETTINGS.forEach(function(s){ s.v = true; });
    renderPrivacy();
    $("#saveNote").innerHTML = "<span style='color:#a00'>All boxes have been ticked.</span>";
  };
}

function checkSolved(){
  var allPrivate = SETTINGS.every(function(s){ return !effective(s); });
  if (allPrivate) T.unlock("doublespeak");
}

/* ============================================================
   THE ROACH MOTEL — seven gates, each a different small task,
   and the exit does not exist. This is where Ghost lives.
   ============================================================ */
var gate = 0, typedRound = 0;
var PHRASES = ["DELETE", "DELETE MY ACCOUNT", "I UNDERSTAND THIS IS PERMANENT"];

function renderDelete(){
  var h = "<h3 class='sec'>Delete Account</h3>" +
          "<p class='lead'>We are sorry to see you go. Please complete the remaining steps.</p>" +
          "<div class='corridor'>step " + (gate+1) + " of 7 &nbsp;|&nbsp; " +
          "[" + "#".repeat(gate) + ".".repeat(7-gate) + "]</div>";

  if (gate === 0){
    h += "<div class='lvl'><h4>Are you sure?</h4>" +
      "<p>You have 0 friends, 0 photographs and 1 unread notification waiting for you.</p>" +
      "<button class='btn95' id='g'>Yes, continue</button> " +
      "<button class='btn95' id='stay'>Take me back</button></div>";
  } else if (gate === 1){
    h += "<div class='lvl'><h4>Why are you leaving?</h4>" +
      "<label class='radio'><input type='radio' name='why'> I will be back shortly</label>" +
      "<label class='radio'><input type='radio' name='why'> I am taking a short break</label>" +
      "<label class='radio'><input type='radio' name='why'> I love Friendspace and will return</label>" +
      "<label class='radio'><input type='radio' name='why'> Other (I will be back shortly)</label>" +
      "<div style='margin-top:9px'><button class='btn95' id='g'>Continue</button></div></div>";
  } else if (gate === 2){
    h += "<div class='lvl'><h4>Type to confirm</h4>" +
      "<p>Type <b>" + PHRASES[typedRound] + "</b> exactly, in capitals.</p>" +
      "<input type='text' id='typed' autocomplete='off'>" +
      "<div style='margin-top:8px'><button class='btn95' id='g'>Confirm</button></div>" +
      "<div class='corridor' id='typeNote'></div></div>";
  } else if (gate === 3){
    h += "<div class='lvl'><h4>Hold to confirm</h4>" +
      "<p>Press and hold the button for five seconds. Do not release it.</p>" +
      "<button class='btn95' id='holdBtn' style='width:100%'>Hold</button>" +
      "<div class='holdbar'><i id='holdFill'></i></div></div>";
  } else if (gate === 4){
    h += "<div class='lvl'><h4>Verify your identity</h4>" +
      "<p>For your security, confirm the account you wish to delete.</p>" +
      "<select id='whoAmI' style='width:100%;padding:3px;border:2px inset #c0c0c0;font:12px sans-serif'>" +
      "<option value=''>Select your account...</option>" +
      "<option>Terri from HR</option><option>Dad</option><option>Dad (2)</option>" +
      "<option value='me'>You</option><option>Aunt Deb</option><option>MARCUS_1987</option>" +
      "</select>" +
      "<div style='margin-top:9px'><button class='btn95' id='g'>Continue</button></div>" +
      "<div class='corridor' id='whoNote'></div></div>";
  } else if (gate === 5){
    h += "<div class='lvl'><h4>Cooling-off period</h4>" +
      "<div class='warn'>Your account will be scheduled for deletion in <b>30 days</b>. " +
      "Logging in during this period will cancel the request.</div>" +
      "<p>You are currently logged in.</p>" +
      "<div style='margin-top:9px'><button class='btn95' id='g'>I accept</button></div></div>";
  } else if (gate === 6){
    h += "<div class='lvl'><h4>Final confirmation</h4>" +
      "<p>This is the last step. Press the button below to permanently delete your " +
      "Friendspace account.</p>" +
      "<button class='btn95' id='final' style='width:100%;font-weight:bold'>" +
      "Permanently Delete My Account</button>" +
      "<div class='corridor' id='finalNote'></div></div>";
  }

  $("#main").innerHTML = h;
  wireDelete();
}

function wireDelete(){
  var g = $("#g");
  if (g) g.onclick = function(){ gate++; renderDelete(); };
  var stay = $("#stay");
  if (stay) stay.onclick = function(){ gate = 0; show("privacy"); };

  if (gate === 2){
    $("#g").onclick = function(){
      var v = ($("#typed").value || "").trim();
      if (v !== PHRASES[typedRound]){
        $("#typeNote").textContent = "That did not match. Please try again.";
        return;
      }
      typedRound++;
      if (typedRound < PHRASES.length){
        renderDelete();
        $("#typeNote").textContent = "Thank you. One more confirmation is required.";
      } else {
        gate++; renderDelete();
      }
    };
  }

  if (gate === 3){
    var t0 = 0, raf = null, btn = $("#holdBtn"), fill = $("#holdFill");
    btn.addEventListener("pointerdown", function(){
      t0 = performance.now();
      (function loop(){
        var p = Math.min(1, (performance.now()-t0)/5000);
        fill.style.width = (p*100) + "%";
        if (p >= 1){ gate++; renderDelete(); return; }
        raf = requestAnimationFrame(loop);
      })();
    });
    ["pointerup","pointerleave","pointercancel"].forEach(function(ev){
      btn.addEventListener(ev, function(){
        cancelAnimationFrame(raf); fill.style.width = "0";
      });
    });
  }

  if (gate === 4){
    $("#g").onclick = function(){
      if ($("#whoAmI").value !== "me"){
        $("#whoNote").textContent = "Please select your own account to continue.";
        return;
      }
      gate++; renderDelete();
    };
  }

  if (gate === 6){
    $("#final").onclick = function(){
      T.unlock("nearly");
      var note = $("#finalNote");
      note.innerHTML = "Deleting...";
      setTimeout(function(){ note.innerHTML = "Deleting.... "; }, 700);
      setTimeout(function(){ note.innerHTML = "Contacting 24 partners..."; }, 1500);
      setTimeout(function(){ note.innerHTML = "Reticulating..."; }, 2300);
      setTimeout(function(){
        $("#main").innerHTML =
          "<h3 class='sec'>Account Deleted</h3>" +
          "<div class='lvl'><p style='font-size:12px'>Your Friendspace account has been " +
          "permanently deleted.</p>" +
          "<p style='color:#a00'>Welcome back! You have 1 new notification.</p>" +
          "<p>While you were away, you liked a post.</p>" +
          "<div style='margin-top:10px'><button class='btn95' id='backToFeed'>Continue to Friendspace</button></div>" +
          "<div class='corridor' style='margin-top:12px'>Ghost — not yet earned.</div></div>";
        $("#backToFeed").onclick = function(){ location.href = "feed.html"; };
        gate = 0; typedRound = 0;
      }, 3200);
    };
  }
}

/* ============================================================
   OTHER SECTIONS
   ============================================================ */
function renderAccount(){
  $("#main").innerHTML =
    "<h3 class='sec'>Account</h3>" +
    "<p class='lead'>Your account details. These cannot be changed.</p>" +
    "<table class='tg'>" +
    "<tr><td>Username</td><td class='st'>user847</td></tr>" +
    "<tr><td>Member since</td><td class='st'>2004</td></tr>" +
    "<tr><td>Email</td><td class='st'>user847@friendspace.example</td></tr>" +
    "<tr><td>Password</td><td class='st'>Buick1974!</td></tr>" +
    "<tr><td>Account status</td><td class='st'>BETA</td></tr>" +
    "</table>" +
    "<div class='warn' style='margin-top:12px'>Your password is displayed here for your " +
    "convenience. It is also displayed on your public profile.</div>";
}

function renderNotifications(){
  $("#main").innerHTML =
    "<h3 class='sec'>Notifications</h3>" +
    "<p class='lead'>Choose what you are told about.</p>" +
    "<table class='tg'>" +
    ["When somebody likes your post","When somebody does not like your post",
     "When nothing happens","When your Top 8 is reordered overnight",
     "When a partner exports your data","Everything else"]
      .map(function(l){
        return "<tr><td class='c'><input type='checkbox' checked disabled></td><td>" + l +
               "</td><td class='st off-v'>LOCKED</td></tr>";
      }).join("") +
    "</table>" +
    "<p class='lead' style='margin-top:11px'>Notification preferences are managed by your " +
    "administrator. You are your administrator.</p>";
}

/* ============================================================
   NAV — the frame that never updates its own highlight
   correctly, because it was written in 2002.
   ============================================================ */
var SECTIONS = [
  { id:"account",       label:"Account",         fn:renderAccount },
  { id:"privacy",       label:"Privacy",         fn:renderPrivacy },
  { id:"notifications", label:"Notifications",   fn:renderNotifications },
  { id:"delete",        label:"Delete Account",  fn:function(){ gate = 0; typedRound = 0; renderDelete(); } }
];

function show(id){
  var s = SECTIONS.filter(function(x){ return x.id === id; })[0] || SECTIONS[0];
  s.fn();
  [].forEach.call($("#nav").querySelectorAll("a"), function(a){
    a.className = (a.dataset.id === id) ? "cur" : "";
  });
  $("#sbLeft").textContent = s.label;
}

(function buildNav(){
  var nav = $("#nav");
  SECTIONS.forEach(function(s){
    var a = document.createElement("a");
    a.textContent = s.label;
    a.dataset.id = s.id;
    a.onclick = function(){ show(s.id); };
    nav.appendChild(a);
  });
  var grp = document.createElement("div");
  grp.className = "grp"; grp.textContent = "Legal";
  nav.appendChild(grp);
  var pp = document.createElement("a");
  pp.textContent = "Privacy Policy";
  pp.onclick = function(){ location.href = "privacy.html"; };
  nav.appendChild(pp);
})();

show("account");
</script>
</body>
</html>
